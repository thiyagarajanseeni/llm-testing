# ── Output Configuration ──────────────────────────────────────
outputPath: ./results.json

# ── Evaluation Settings ───────────────────────────────────────
evaluateOptions:
  maxConcurrency: 2        # Keep low to avoid rate limits during the lab
  delay: 500               # 500ms delay between calls — avoids burst rate limits

