# Module 7B — Cost Evaluation Workshop (Session 3, Hour 2)
# Track 2A: LLM & GenAI Testing Essentials
#
# Usage:
#   npx promptfoo eval --config promptfoo_cost.yaml --output results.json
#   npx promptfoo view
#
# Prerequisites:
#   - OPENAI_API_KEY set in .env
#   - ANTHROPIC_API_KEY set in .env
#   - LM Studio running at http://localhost:1234 with Llama-3 loaded
# ============================================================

description: "Session 3 Hour 2 — Multi-provider cost comparison across GPT-4o, Claude Sonnet, Llama-3"

# ── Providers ────────────────────────────────────────────────
providers:
  - id: openai:gpt-4o
    label: "GPT-4o (OpenAI)"
    config:
      temperature: 0
      max_tokens: 256


