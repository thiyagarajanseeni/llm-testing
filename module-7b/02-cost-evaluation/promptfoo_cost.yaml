# ── System Prompt ─────────────────────────────────────────────
# Intentionally short — we are measuring cost, so keep system
# prompt tokens minimal and consistent across all providers.
prompts:
  - label: "intent-classifier"
    raw: |
      Classify the intent of the following customer message.
      Reply with exactly one word from: cancel / statement / technical support / complaint / Superannuation plans / administration charges / other.

      Message: {{message}}

# ── Test Cases ────────────────────────────────────────────────
# 5 diverse prompt types matching cost_comparison.py TEST_PROMPTS
# Each maps to a real-world customer service scenario

tests:

  # 1. Cancellation intent
  - description: "Clear cancellation request"
    vars:
      message: "I want to cancel my Superannuation immediately"
    assert:
      - type: contains
        value: "cancel"
      - type: llm-rubric
        value: "Response correctly identifies cancellation as the primary intent"
      - type: cost
        threshold: 0.002   # Fail if this single call costs more than $0.002

  # 2. Statement inquiry
  - description: "Superannuation Statement Question"
    vars:
      message: "I was charged twice for administration charges"
    assert:
      - type: contains
        value: "administration charges"
      - type: llm-rubric
        value: "Response identifies complaint on administration charges inquiry as the intent"
      - type: cost
        threshold: 0.002

  # 3. Technical support
  - description: "Technical issue report"
    vars:
      message: "The Superannuation app keeps crashing every time I try to log in on my iPhone"
    assert:
      - type: contains
        value: "technical support"
      - type: llm-rubric
        value: "Response identifies a technical support request"
      - type: cost
        threshold: 0.002

  # 4. Complaint
  - description: "Customer complaint"
    vars:
      message: "This is absolutely unacceptable. I've been waiting 3 weeks for a response for my complaint"
    assert:
      - type: contains
        value: "complaint"
      - type: llm-rubric
        value: "Response identifies a complaint or frustration as the primary intent"
      - type: cost
        threshold: 0.002

  # 5. General / other
  - description: "General / ambiguous inquiry"
    vars:
      message: "Hi, I just wanted to know what Superannuation plans you offer"
    assert:
      - type: contains-any
        value:
        - "other"
        - "technical support"
        - "statement"
        - "Superannuation plans"
        - "administration charges"
      - type: llm-rubric
        value: "Response identifies a general inquiry on Superannuation plans"
      - type: cost
        threshold: 0.002

