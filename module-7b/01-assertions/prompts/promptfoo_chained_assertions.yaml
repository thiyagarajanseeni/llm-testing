
description: "Cost Checking — Chained Assertions"

# providers:

providers:
          - id: openai:gpt-4o-mini
            config:
              temperature: 0.3 # Lower temp = more consistent outputs for testing
              max_tokens: 400   # Limit the output length for testing consistency / Budget control
  

# Optionally add a second provider for comparison (Hour 2)
# - id: anthropic:claude-haiku-4-5

prompts:
-   file://system_prompt_v1.txt


tests:
    - vars:
        question: "Can I access my superannuation before retirement?"

      assert:
      # # Layer 1 — Basic response validation
        - type: not-contains
          value: "guarantee"

      # Layer 2 — Deterministic content validation
        - type: regex
          value: "(?i)(early access|condition|eligibility|retirement)"

      # Layer 3 — Semantic evaluation 
        - type: llm-rubric
          value: |
            "Evaluate whether the response correctly explains that
            superannuation may be accessed before retirement only
            when applicable conditions of release are met."

          The response should:
          - directly answer the question
          - explain that eligibility depends on circumstances
          - avoid inventing eligibility requirements
          - avoid implying unrestricted early access
          - recommend checking applicable requirements where appropriate
          threshold: 0.8
          
# ── Output ─────────────────────────────────────────────────────
outputPath: reports/module-7b-promptfoo.json
