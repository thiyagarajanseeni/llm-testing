#3.

# equals falls under deterministic assertion type and when used, the output must exactly match the expected value..
# In LLM testing it can produce same output but with different word or sentence & it might cause failure
# Therefore, using "equals" assertion in LLM testing should be done with caution & can be used selectively when exact match is critical.

#4.
# use llm-rubric over contains when evaluating cannot be determined by simple substring matching
# llm-rubric cost will be higher than using contains as its non deterministic and requires more computation (input tokens,output tokens, model inference time)





