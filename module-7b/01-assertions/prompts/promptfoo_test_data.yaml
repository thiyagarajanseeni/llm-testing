description: "Running tests from test_data.csv"

providers:
        - id: openai:gpt-4o-mini
          config:
              temperature: 0.3 # Lower temp = more consistent outputs for testing
              max_tokens: 400   # Limit the output length for testing consistency / Budget control


#  - anthropic:claude-haiku-4-5-20251001

prompts:
  - file://system_prompt_v1.txt

tests: file://data/test_data.csv

# PromptFoo will read __expected__ from each row
# and replace {{variables}} using other column values

# ── Output ─────────────────────────────────────────────────────
outputPath: reports/module-7b-promptfoo.json


